<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infra Solutions</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Infra Solutions</h1>
        <p>Soluciones tecnológicas confiables para tu empresa</p>
        <nav>
            <a href="#productos">Productos</a>
            <a href="#servicios">Servicios</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>

    <section id="productos">
        <h2>Productos</h2>
        <div id="lista-productos"></div>
    </section>

    <section id="servicios">
        <h2>Servicios</h2>
        <ul>
            <li>Soporte en infraestructura TI</li>
            <li>Consultoría tecnológica</li>
            <li>Mantenimiento de sistemas y redes</li>
        </ul>
    </section>

    <section id="contacto">
        <h2>Contacto</h2>
        <form id="form-contacto">
            <input type="text" placeholder="Nombre" required>
            <input type="email" placeholder="Correo" required>
            <textarea placeholder="Mensaje"></textarea>
            <button type="submit">Enviar</button>
        </form>
    </section>

    <footer>
        <p>© 2026 Infra Solutions. Todos los derechos reservados.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
